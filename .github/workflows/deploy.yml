name: Deploy BFI Classroom to Oracle Cloud

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@7eaf76671a0eb5032435f9c06371cb788f4b005e # v1.0.3 SHA-pinned
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting canonical automated deployment on Oracle Cloud..."
            cd /home/ubuntu/bfi-classroom

            # Preserve production .env if backup exists
            if [ -f /home/ubuntu/.env.bfi ]; then
              cp /home/ubuntu/.env.bfi .env.backup
            fi

            # Clean any untracked diffs on tracked configuration files
            git checkout -- ecosystem.config.cjs || true

            # Fetch target commit so it is available locally on remote host
            git fetch origin main

            # Execute canonical deployment lifecycle with pinned commit SHA and fail-closed rollback trap
            # (Phases 0-6: recovery tooling preservation, pre-flight lockdown, isolation verification,
            # online SQLite .backup API with PRAGMA integrity & invariant checks, pinned commit checkout,
            # deterministic build & dependency pruning, atomic migrations, loopback smoke checks,
            # exposure-state tracking, and controlled traffic reopening)
            trap 'echo "❌ Deployment step halted; executing fail-closed rollback..."; if [ -f server/.recovery_tools/production_lifecycle.cjs ]; then node server/.recovery_tools/production_lifecycle.cjs rollback; elif [ -f scripts/production_lifecycle.cjs ]; then node scripts/production_lifecycle.cjs rollback; fi' ERR

            node scripts/production_lifecycle.cjs deploy --target-commit ${{ github.sha }}

            trap - ERR

            # Restore production .env if needed
            if [ -f .env.backup ]; then
              cp .env.backup .env
              rm -f .env.backup
            fi

            echo "✅ Canonical deployment completed successfully!"
