# ==============================================================================
# CANONICAL DEPLOYMENT STANDARD & OPERATOR-DRIVEN RUNBOOK
# ==============================================================================
# AUTHORITATIVE STANDARD:
# The primary, authoritative execution standard for BFI Classroom production
# deployment is the OPERATOR-DRIVEN CANONICAL RUNBOOK documented in:
# docs/runbooks/super-admin-deployment-and-rollback-runbook.md
# and production-release-approval-checklist.md
#
# AUTOMATED WORKFLOW DISPATCH:
# This workflow is strictly OPERATOR-TRIGGERED via workflow_dispatch.
# It NEVER executes automatically on push or pull-request merge.
#
# WHOLE-VALUE INPUT VALIDATION & LEAST PRIVILEGE:
# All workflow inputs are validated in an isolated runner step before invoking SSH.
# Inputs are passed strictly as environment variables (NEVER inline template interpolation).
# Target commits must be strictly whole-value 40 hexadecimal characters with zero
# newlines, carriage returns, or whitespace.
#
# UNATTENDED CI CREDENTIAL PREREQUISITES:
# When triggered via workflow_dispatch, smoke credentials must be pre-supplied
# as repository/environment secrets:
# - SMOKE_SUPER_ADMIN_TOKEN
# - SMOKE_ADMIN_TOKEN
#
# In Phase 0, production_lifecycle.cjs validates credential handoff capability.
# If running without verified smoke credentials, deployment immediately
# HALTS CLOSED in Phase 0 *before* stopping Nginx or PM2, preventing service
# disruption.
# ==============================================================================

name: Deploy BFI Classroom to Oracle Cloud

'on':
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Exact pinned immutable Git commit SHA to deploy (40 hex characters)'
        required: true
        type: string
        default: '8d0bbfd65901a98620374baedfc7ea620280b006'
      rotate_mfa:
        description: 'Perform atomic MFA secret rotation during deployment'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate Workflow Inputs
        id: validate
        env:
          RAW_TARGET_COMMIT: ${{ github.event.inputs.target_commit }}
          RAW_ROTATE_MFA: ${{ github.event.inputs.rotate_mfa }}
        run: |
          set -e
          echo "=== Step 1: Runner-Side Input Validation ==="

          COMMIT="${RAW_TARGET_COMMIT:-8d0bbfd65901a98620374baedfc7ea620280b006}"

          # Whole-value check 1: Exact length must be 40 characters
          if [ "${#COMMIT}" -ne 40 ]; then
            echo "❌ ERROR: target_commit length is ${#COMMIT}, expected exactly 40 characters." >&2
            exit 1
          fi

          # Whole-value check 2: Native Bash regex match (binds to full string)
          if ! [[ "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "❌ ERROR: target_commit must be exactly 40 hexadecimal characters." >&2
            exit 1
          fi

          # Whole-value check 3: Strip hex characters; result must be empty
          NON_HEX="${COMMIT//[0-9a-fA-F]/}"
          if [ -n "$NON_HEX" ]; then
            echo "❌ ERROR: target_commit contains non-hex characters." >&2
            exit 1
          fi

          # Whole-value check 4: Reject any whitespace, newlines, or carriage returns
          case "$COMMIT" in
            *[[:space:]]*|*$'\n'*|*$'\r'*)
              echo "❌ ERROR: target_commit contains forbidden whitespace or newline characters." >&2
              exit 1
              ;;
          esac

          # Normalize to lowercase
          NORMALIZED_COMMIT=$(echo "$COMMIT" | tr '[:upper:]' '[:lower:]')

          # Strict validation of rotate_mfa: boolean true or false
          MFA="${RAW_ROTATE_MFA:-true}"
          if [ "${#MFA}" -ne 4 ] && [ "${#MFA}" -ne 5 ]; then
            echo "❌ ERROR: rotate_mfa length is invalid. Received: '$MFA'" >&2
            exit 1
          fi

          if [ "$MFA" != "true" ] && [ "$MFA" != "false" ]; then
            echo "❌ ERROR: rotate_mfa must be 'true' or 'false'. Received: '$MFA'" >&2
            exit 1
          fi

          case "$MFA" in
            *[[:space:]]*|*$'\n'*|*$'\r'*)
              echo "❌ ERROR: rotate_mfa contains forbidden whitespace or newline characters." >&2
              exit 1
              ;;
          esac

          echo "✅ Runner input validation passed."
          echo "target_commit=$NORMALIZED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "rotate_mfa=$MFA" >> "$GITHUB_OUTPUT"

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@7eaf76671a0eb5032435f9c06371cb788f4b005e # v1.0.3 SHA-pinned
        env:
          TARGET_COMMIT: ${{ steps.validate.outputs.target_commit }}
          ROTATE_MFA: ${{ steps.validate.outputs.rotate_mfa }}
          SUPER_ADMIN_TOKEN: ${{ secrets.SMOKE_SUPER_ADMIN_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: TARGET_COMMIT,ROTATE_MFA,SUPER_ADMIN_TOKEN,ADMIN_TOKEN
          script: |
            set -e
            echo "🚀 Starting canonical operator-triggered deployment on Oracle Cloud..."
            cd /home/ubuntu/bfi-classroom

            # === REMOTE VALIDATION STEP 1: Whole-value validation of environment variables ===
            if [ "${#TARGET_COMMIT}" -ne 40 ]; then
              echo "❌ Remote validation error: TARGET_COMMIT length is ${#TARGET_COMMIT}, expected exactly 40 characters." >&2
              exit 1
            fi

            if ! [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "❌ Remote validation error: TARGET_COMMIT must be exactly 40 lowercase hexadecimal characters." >&2
              exit 1
            fi

            NON_HEX="${TARGET_COMMIT//[0-9a-f]/}"
            if [ -n "$NON_HEX" ]; then
              echo "❌ Remote validation error: TARGET_COMMIT contains non-hex characters." >&2
              exit 1
            fi

            case "$TARGET_COMMIT" in
              *[[:space:]]*|*$'\n'*|*$'\r'*)
                echo "❌ Remote validation error: TARGET_COMMIT contains forbidden whitespace or newlines." >&2
                exit 1
                ;;
            esac

            if [ "$ROTATE_MFA" != "true" ] && [ "$ROTATE_MFA" != "false" ]; then
              echo "❌ Remote validation error: ROTATE_MFA must be 'true' or 'false'." >&2
              exit 1
            fi

            case "$ROTATE_MFA" in
              *[[:space:]]*|*$'\n'*|*$'\r'*)
                echo "❌ Remote validation error: ROTATE_MFA contains forbidden whitespace or newlines." >&2
                exit 1
                ;;
            esac

            echo "Validated target commit: $TARGET_COMMIT"
            echo "MFA rotation enabled: $ROTATE_MFA"

            # === REMOTE VALIDATION STEP 2: Fail on unexpected dirty tracked files ===
            # Do NOT silently discard configuration changes via git checkout.
            DIRTY_TRACKED=$(git status --porcelain -uno)
            if [ -n "$DIRTY_TRACKED" ]; then
              echo "❌ Preflight error: Uncommitted tracked changes detected on remote checkout:" >&2
              echo "$DIRTY_TRACKED" >&2
              exit 1
            fi

            # === REMOTE VALIDATION STEP 3: Fetch and verify target object is a genuine commit ===
            git fetch origin "$TARGET_COMMIT" || git fetch origin integration/super-admin-candidate || git fetch origin main

            RESOLVED_TYPE=$(git cat-file -t "$TARGET_COMMIT" 2>/dev/null || true)
            if [ "$RESOLVED_TYPE" != "commit" ]; then
              echo "❌ Remote validation error: Object $TARGET_COMMIT is not a valid git commit object (type: '$RESOLVED_TYPE')." >&2
              exit 1
            fi
            echo "✅ Verified remote git object $TARGET_COMMIT is a valid commit."

            # === STEP 4: Extract ALL 7 recovery tools directly from target commit ===
            mkdir -p server/.recovery_tools
            for tool in production_lifecycle.cjs rotate_mfa_secrets.cjs run_migrations.cjs verify_isolation.cjs preflight_lockdown_check.cjs production_smoke_check.cjs obtain_smoke_credentials.cjs; do
              git show "$TARGET_COMMIT":scripts/$tool > server/.recovery_tools/$tool
              chmod 755 server/.recovery_tools/$tool
            done

            node -e '
              const path = require("path");
              const dir = "server/.recovery_tools";
              const tools = [
                "production_lifecycle.cjs",
                "rotate_mfa_secrets.cjs",
                "run_migrations.cjs",
                "verify_isolation.cjs",
                "preflight_lockdown_check.cjs",
                "production_smoke_check.cjs",
                "obtain_smoke_credentials.cjs"
              ];
              for (const t of tools) require(path.resolve(dir, t));
              console.log("BUNDLE_VERIFIED_OK");
            '

            # === STEP 5: Fail-closed rollback trap ===
            trap 'echo "❌ Deployment step halted; executing fail-closed rollback..."; if [ -f server/.recovery_tools/production_lifecycle.cjs ]; then node server/.recovery_tools/production_lifecycle.cjs rollback; elif [ -f scripts/production_lifecycle.cjs ]; then node scripts/production_lifecycle.cjs rollback; fi' ERR

            EXTRA_FLAGS=""
            if [ "$ROTATE_MFA" = "true" ]; then
              EXTRA_FLAGS="--rotate-mfa"
              export NEW_MFA_ENCRYPTION_KEY="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
            fi

            # === STEP 6: Execute Canonical Deployment Lifecycle ===
            node server/.recovery_tools/production_lifecycle.cjs deploy --target-commit "$TARGET_COMMIT" $EXTRA_FLAGS

            trap - ERR

            echo "✅ Canonical deployment completed successfully!"
