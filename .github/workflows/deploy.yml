# ==============================================================================
# CANONICAL DEPLOYMENT STANDARD & OPERATOR-DRIVEN RUNBOOK
# ==============================================================================
# AUTHORITATIVE STANDARD:
# The primary, authoritative execution standard for BFI Classroom production
# deployment is the OPERATOR-DRIVEN INTERACTIVE RUNBOOK documented in:
# docs/runbooks/super-admin-deployment-and-rollback-runbook.md
#
# The interactive workflow enables bounded, confidential credential handoff
# via obtain_smoke_credentials.cjs over an interactive TTY, ensuring privileged
# credentials (Super Admin & Ordinary Admin tokens) are never stored in plain text
# on disk or in CI secrets.
#
# UNATTENDED CI AUTOMATION:
# When this GitHub Actions workflow is executed unattended, smoke credentials MUST
# be pre-supplied as repository environment secrets:
# - SMOKE_SUPER_ADMIN_TOKEN
# - SMOKE_ADMIN_TOKEN
#
# In Phase 0, production_lifecycle.cjs validates credential handoff capability.
# If running non-interactively without verified smoke credentials, deployment
# immediately HALTS CLOSED in Phase 0 *before* stopping Nginx or PM2, preventing
# service disruption.
# ==============================================================================

name: Deploy BFI Classroom to Oracle Cloud

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@7eaf76671a0eb5032435f9c06371cb788f4b005e # v1.0.3 SHA-pinned
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting canonical automated deployment on Oracle Cloud..."
            cd /home/ubuntu/bfi-classroom

            # Preserve production .env if backup exists
            if [ -f /home/ubuntu/.env.bfi ]; then
              cp /home/ubuntu/.env.bfi .env.backup
            fi

            # Clean any untracked diffs on tracked configuration files
            git checkout -- ecosystem.config.cjs || true

            # Fetch target commit so it is available locally on remote host
            git fetch origin main

            # Unattended CI Smoke Credential Injection (Validated in Phase 0 before service disruption)
            export SUPER_ADMIN_TOKEN="${{ secrets.SMOKE_SUPER_ADMIN_TOKEN }}"
            export ADMIN_TOKEN="${{ secrets.SMOKE_ADMIN_TOKEN }}"

            # Extract recovery tools directly from target commit, verify SHA-256 and cold-start bundle load
            mkdir -p server/.recovery_tools
            for tool in preflight_lockdown_check.cjs verify_isolation.cjs run_migrations.cjs production_smoke_check.cjs production_lifecycle.cjs obtain_smoke_credentials.cjs; do
              git show ${{ github.sha }}:scripts/$tool > server/.recovery_tools/$tool
              chmod 755 server/.recovery_tools/$tool
            done

            node -e '
              const path = require("path");
              const dir = "server/.recovery_tools";
              const tools = ["preflight_lockdown_check.cjs", "verify_isolation.cjs", "run_migrations.cjs", "production_smoke_check.cjs", "production_lifecycle.cjs", "obtain_smoke_credentials.cjs"];
              for (const t of tools) require(path.resolve(dir, t));
              console.log("BUNDLE_VERIFIED_OK");
            '

            # Execute canonical deployment lifecycle using verified preserved runner
            # Fail-closed rollback trap restores services safely without touching DB if failure occurred before backup
            trap 'echo "❌ Deployment step halted; executing fail-closed rollback..."; if [ -f server/.recovery_tools/production_lifecycle.cjs ]; then node server/.recovery_tools/production_lifecycle.cjs rollback; elif [ -f scripts/production_lifecycle.cjs ]; then node scripts/production_lifecycle.cjs rollback; fi' ERR

            node server/.recovery_tools/production_lifecycle.cjs deploy --target-commit ${{ github.sha }}

            trap - ERR

            # Restore production .env if needed
            if [ -f .env.backup ]; then
              cp .env.backup .env
              rm -f .env.backup
            fi

            echo "✅ Canonical deployment completed successfully!"
