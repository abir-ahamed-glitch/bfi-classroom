# ==============================================================================
# Nginx Hardening: Private Inbox Attachment Direct Access Lockdown
# ==============================================================================
# File: /etc/nginx/snippets/inbox-attachments-lockdown.conf
#
# PURPOSE:
# Prevents unauthenticated direct static file serving of sensitive private inbox
# attachments stored under /home/ubuntu/bfi-classroom/uploads/inbox-attachments/.
#
# SECURITY DEFENSE:
# The ^~ (best non-regex prefix match) directive halts location searching and
# immediately returns HTTP 403 Forbidden for any request beginning with
# /uploads/inbox-attachments/.
#
# LEGITIMATE ACCESS PRESERVATION:
# Authenticated conversation participants continue to download their attachments
# via the authenticated Express API route:
# GET /api/inbox/attachments/:filename
# which verifies session tokens, participant membership, and streams the file securely.
# ==============================================================================

location ^~ /uploads/inbox-attachments/ {
    return 403;
}
