# ==============================================================================
# Nginx Hardening: Cloudflare Proxy IP Trust Boundary & Anti-Spoofing
# ==============================================================================
# File: /etc/nginx/snippets/cloudflare-real-ip.conf
#
# PURPOSE:
# Establishes a verified IP trust boundary between Cloudflare and the origin.
# Neutralizes CF-Connecting-IP spoofing attacks on direct origin connections while
# guaranteeing 100% accurate client attribution for rate limiters and audit logs.
#
# HOW IT WORKS:
# 1. Nginx's ngx_http_realip_module inspects incoming TCP socket connections ($remote_addr).
# 2. ONLY IF the TCP socket originates from official Cloudflare CIDRs below, Nginx
#    replaces $remote_addr with the value in the CF-Connecting-IP header.
# 3. If a request reaches the origin directly (bypassing Cloudflare), Nginx leaves
#    $remote_addr as the client's actual TCP IP.
# 4. In the proxy block, Nginx overwrites upstream headers:
#      proxy_set_header CF-Connecting-IP $remote_addr;
#      proxy_set_header X-Real-IP $remote_addr;
#      proxy_set_header X-Forwarded-For $remote_addr;
#    This guarantees that Node.js (and getClientIp()) ALWAYS receives the verified
#    canonical IP and CANNOT be tricked by forged client headers.
# ==============================================================================

# Cloudflare IPv4 CIDRs
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 CIDRs
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;
