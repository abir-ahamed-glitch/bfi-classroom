# ==============================================================================
# Complete Hardened Nginx Virtual Host Configuration
# ==============================================================================
# Target: /etc/nginx/sites-available/default
#
# Hardening highlights:
# 1. Blocks direct static access to private inbox attachments (/uploads/inbox-attachments/)
# 2. Enforces verified Cloudflare IP proxy boundary (CF-Connecting-IP anti-spoofing)
# 3. Preserves legitimate uploads, avatars, course materials, and certificates
# 4. Forwards verified client IP to upstream Express backend
# ==============================================================================

# Cloudflare Proxy IP Trust Boundaries
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name classroom.bfibd.org 129.221.243.153 _;

    ssl_certificate /etc/ssl/certs/classroom.crt;
    ssl_certificate_key /etc/ssl/private/classroom.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --------------------------------------------------------------------------
    # SEC-02: Block direct unauthenticated access to private inbox attachments
    # --------------------------------------------------------------------------
    location ^~ /uploads/inbox-attachments/ {
        return 403;
    }

    # Public static uploads (avatars, course materials, certificate images)
    location /uploads/ {
        alias /home/ubuntu/bfi-classroom/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options nosniff;
    }

    # Reverse proxy to Express backend
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # SEC-03: Pass verified remote address; neutralize spoofed client headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}
